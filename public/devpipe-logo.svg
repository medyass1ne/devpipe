<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DevPipe logo</title>
  <desc>A minimalist hub-and-spoke mark: a central amber node connected by thin lines to four outer nodes, one shown in a muted diff-green, on a dark ink squircle background.</desc>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0D0F10"/>

  <!-- spokes -->
  <line x1="256" y1="256" x2="256" y2="118" stroke="#33383B" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="394" y2="256" stroke="#33383B" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="256" y2="394" stroke="#33383B" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="118" y2="256" stroke="#33383B" stroke-width="7" stroke-linecap="round"/>

  <!-- outer nodes -->
  <circle cx="256" cy="118" r="24" fill="#6B9080"/>
  <circle cx="394" cy="256" r="20" fill="#54595C"/>
  <circle cx="256" cy="394" r="20" fill="#54595C"/>
  <circle cx="118" cy="256" r="20" fill="#54595C"/>

  <!-- hub -->
  <circle cx="256" cy="256" r="52" fill="#D9A441"/>
</svg>
